[platformio]
src_dir = .

[env:esp12f]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager
    dancol90/ESP8266Ping
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    bblanchon/ArduinoJson @ ^7.0.0
